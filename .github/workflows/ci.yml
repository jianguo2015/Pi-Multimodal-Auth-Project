name: CI

# Validates a public clone: no biometric data, no Research extras in the main job,
# and no "green because everything was skipped" - each skip has to carry its
# documented reason. See docs/FRESH_CLONE_VALIDATION.md and docs/TESTING.md.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  public-tier:
    name: public tier (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the real floor: the pinned onnxruntime 1.24.1 publishes
        # cp311..cp314 wheels only (no cp310), so `>=3.10` was uninstallable.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the documented requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt
      - name: The documented public command must be meaningful (marker is registered)
        run: python -m pytest --markers | grep -q "private_data"
      - name: Public test tier (never needs the biometric data)
        run: python -m pytest -m "not private_data" -rs
      - name: End-to-end inference on the shipped synthetic examples
        run: |
          python examples/make_examples.py
          python scripts/infer.py --face examples/sample_face.jpg --voice examples/sample_voice.wav
      - name: Reports must stay portable (no absolute path, no local user name)
        run: |
          mkdir -p outputs
          python scripts/infer.py --face examples/sample_face.jpg --voice examples/sample_voice.wav | tee outputs/infer.txt
          python scripts/infer.py --face examples/sample_face.jpg --voice examples/sample_voice.wav --json > outputs/infer.json
          python -c 'import json,pathlib,re; d=json.loads(pathlib.Path("outputs/infer.json").read_text(encoding="utf-8")); assert d["decision"]["decision"]=="REJECT", d["decision"]; assert set(d["model_files"])=={"face","voice","fusion"}; assert d["model_files"]["face"].startswith("weights/"); blob=json.dumps(d); assert not re.search(r"[A-Za-z]:[\\/]|/home/|/Users/", blob), "absolute path leaked into the JSON report"; print("portable JSON report:", d["model_files"])'
          python -c 'import pathlib,re; t=pathlib.Path("outputs/infer.txt").read_text(encoding="utf-8"); assert "REJECT" in t, t; assert not re.search(r"[A-Za-z]:[\\/]|/home/|/Users/", t), "absolute path leaked into the human report"; print("portable human report")'
      - name: Benchmark smoke (warm-up 1, runs 3)
        run: python scripts/benchmark.py --warmup 1 --runs 3

  artifact-integrity:
    name: artifact integrity (weights/ must match the manifest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime, test and CPU-only research extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0"
      - name: Every shipped artifact must match its size and SHA-256
        run: python -m pytest tests/test_artifacts.py -v

  research-tier:
    name: research tier (skips must be the documented ones)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime, test and CPU-only research extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0"
      - name: The reference tier must be skipped for the missing data, and only for that
        run: |
          set -o pipefail
          python -m pytest tests/test_phase0_reference.py -rs -q | tee reference.log
          grep -q "^SKIPPED \[4\] tests/test_phase0_reference.py: private biometric data not present on this machine$" reference.log
      - name: Full suite with the research extras (4 skips, documented reason)
        run: python -m pytest -rs -q
