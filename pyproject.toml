[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-auth"
version = "0.1.0"
description = "Two-modality (face + voice) identity-verification prototype with attention-gated fusion"
readme = "README.md"
requires-python = ">=3.10"
# NOTE: no license field on purpose. The repository has no LICENSE file yet and
# the third-party situation must be reviewed first - see docs/OPEN_SOURCE_RISK.md
# and the License section of README.md.
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "onnxruntime==1.24.1",
    "opencv-python-headless>=4.8",
    "librosa>=0.10",
    "soundfile>=0.12",
]

[project.optional-dependencies]
research = ["torch>=2.0", "torchvision>=0.15", "onnx>=1.14"]
dev = ["pytest>=8.0"]

[project.scripts]
multimodal-auth = "multimodal_auth.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "private_data: needs local biometric data, skipped when unavailable",
]

